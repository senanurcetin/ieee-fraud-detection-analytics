version: 2

models:
  - name: int_fraud_joined
    description: "Joins transaction and identity staging tables at unique transaction grain."
    config:
      tags: ["intermediate", "fraud"]
    columns:
      - name: transaction_id
        description: "Unique transaction key."
        tests:
          - not_null
          - unique
      - name: transaction_amount
        description: "Transaction amount."
        tests:
          - not_null
          - not_negative
      - name: has_identity
        description: "Indicates whether the transaction has a matching identity record."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

  - name: int_features
    description: "Creates amount, product, card, email, device, synthetic UID, and relative time segments for marts and reporting."
    config:
      tags: ["intermediate", "fraud", "feature_engineering"]
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: amount_band
        description: "Amount band used by executive reporting."
        tests:
          - not_null
      - name: product_cd_clean
        description: "Cleaned ProductCD value."
        tests:
          - not_null
      - name: purchaser_email_group
        description: "Purchaser email domain segment."
        tests:
          - not_null
      - name: purchaser_email_risk_group
        description: "Business-facing email risk group: mainstream consumer, privacy masked, institutional, unknown, or long-tail."
        tests:
          - not_null
