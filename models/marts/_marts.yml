version: 2

models:
  - name: mart_fraud_summary
    description: "Portfolio-level fraud, identity coverage, and amount summary metrics for executive reporting."
    config:
      tags: ["mart", "fraud", "executive"]
    tests:
      - row_count_equals:
          arguments:
            expected_count: 1
    columns:
      - name: fraud_rate
        tests:
          - fraud_rate_between:
              arguments:
                min_value: 0.03
                max_value: 0.04

  - name: mart_daily_stats
    description: "Relative-day volume, fraud rate, moving average, and drift flag. TransactionDT is treated as elapsed seconds, not a calendar timestamp."
    config:
      tags: ["mart", "fraud", "time"]
    columns:
      - name: transaction_day
        tests:
          - not_null
          - unique
      - name: fraud_rate
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: mart_amount_bands
    description: "Fraud rate, lift, and portfolio share by transaction amount band."
    config:
      tags: ["mart", "fraud", "amount"]
    columns:
      - name: amount_band
        tests:
          - not_null
          - unique
      - name: lift
        tests:
          - not_negative

  - name: mart_product_device_stats
    description: "Risk concentration by product and device segment."
    config:
      tags: ["mart", "fraud", "segment"]
    columns:
      - name: fraud_rate
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: mart_email_domain_stats
    description: "Volume, fraud rate, and lift by purchaser email domain group."
    config:
      tags: ["mart", "fraud", "email"]
    columns:
      - name: purchaser_email_group
        tests:
          - not_null
          - unique

  - name: mart_identity_product_coverage
    description: "Identity coverage and fraud-rate comparison by ProductCD. Supports the finding that identity availability is itself a risk segmentation signal."
    config:
      tags: ["mart", "fraud", "identity", "product"]
    columns:
      - name: product_cd
        tests:
          - not_null
          - unique
      - name: identity_coverage_rate
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: fraud_rate
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: mart_time_amount_signals
    description: "Relative TransactionDT hour and TransactionAmt decimal-pattern risk signals for operational scheduling and threshold design."
    config:
      tags: ["mart", "fraud", "time", "amount"]
    columns:
      - name: transaction_hour
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 23
      - name: fraud_rate
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: mart_feature_missingness
    description: "Column-level missingness rates from raw source tables for data quality reporting."
    config:
      tags: ["mart", "data_quality"]
    columns:
      - name: missing_rate
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: mart_model_predictions
    description: "Model scores and risk bands."
    config:
      tags: ["mart", "model"]
    columns:
      - name: transaction_id
        tests:
          - not_null
      - name: predicted_fraud_probability
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: risk_band
        tests:
          - accepted_values:
              arguments:
                values: ["Low", "Elevated", "High", "Critical"]

  - name: mart_risk_band_stats
    description: "Observed fraud rate, lift, and operational review priority by risk band."
    config:
      tags: ["mart", "model", "executive"]
    columns:
      - name: risk_band
        tests:
          - accepted_values:
              arguments:
                values: ["Low", "Elevated", "High", "Critical"]
      - name: band_rank
        tests:
          - accepted_range:
              arguments:
                min_value: 1
                max_value: 4
