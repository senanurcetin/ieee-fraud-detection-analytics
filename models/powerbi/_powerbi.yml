version: 2

models:
  - name: fact_train_transactions
    description: "Power BI DirectQuery fact table for train transactions with fraud label, segments, engineered fields, and model score."
    config:
      tags: ["powerbi", "fraud"]
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: is_fraud
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: transaction_hour
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 23

  - name: pbi_executive_kpis
    description: "Single-row KPI table for executive summary reporting."
    config:
      tags: ["powerbi", "executive"]
    tests:
      - row_count_equals:
          arguments:
            expected_count: 1

  - name: pbi_product_risk
    description: "Fraud rate, lift, and risk contribution by product."
    config:
      tags: ["powerbi", "executive", "segment"]

  - name: pbi_identity_risk
    description: "Fraud risk by identity record availability."
    config:
      tags: ["powerbi", "executive", "identity"]

  - name: pbi_identity_product_coverage
    description: "Product-level identity coverage and fraud-rate evidence for executive risk segmentation."
    config:
      tags: ["powerbi", "identity", "product", "executive"]
    columns:
      - name: product_cd
        tests:
          - not_null
          - unique
      - name: identity_coverage_rate
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: pbi_amount_bands
    description: "Pre-aggregated amount-band table for DirectQuery-friendly reporting."
    config:
      tags: ["powerbi", "amount"]

  - name: pbi_daily_drift
    description: "Relative-day fraud drift and volume trend."
    config:
      tags: ["powerbi", "time"]

  - name: pbi_time_amount_signals
    description: "Relative hour and amount-decimal risk signals used for operational staffing and dynamic threshold discussion."
    config:
      tags: ["powerbi", "time", "amount", "operations"]
    tests:
      - row_count_between:
          arguments:
            min_count: 24
            max_count: 48

  - name: pbi_payment_heatmap
    description: "Card network and card type risk matrix."
    config:
      tags: ["powerbi", "payment"]

  - name: pbi_email_domain_risk
    description: "Fraud risk by purchaser email domain group."
    config:
      tags: ["powerbi", "email"]

  - name: pbi_model_risk_bands
    description: "Model risk bands and operational prioritization metrics."
    config:
      tags: ["powerbi", "model", "executive"]

  - name: pbi_feature_importance
    description: "Model feature importance ranking."
    config:
      tags: ["powerbi", "model"]

  - name: pbi_data_quality_scorecard
    description: "Feature-family missingness scorecard for data quality reporting."
    config:
      tags: ["powerbi", "data_quality"]

  - name: pbi_report_narrative
    description: "Executive message, analytical focus, and recommended action text for report pages."
    config:
      tags: ["powerbi", "executive", "storytelling"]

  - name: pbi_quality_contract
    description: "Row-count and quality contract table suitable for reporting."
    config:
      tags: ["powerbi", "data_quality", "qa"]
    columns:
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ["PASS"]

  - name: pbi_segment_watchlist
    description: "Unified operational watchlist across product, identity, amount, payment, and email segments."
    config:
      tags: ["powerbi", "executive", "segment", "watchlist"]
    tests:
      - row_count_between:
          arguments:
            min_count: 10
            max_count: 20
    columns:
      - name: watchlist_rank
        tests:
          - not_null
          - unique
      - name: risk_priority
        tests:
          - accepted_values:
              arguments:
                values: ["Kritik", "Yüksek", "İzle", "Normal"]

  - name: pbi_review_strategy
    description: "Maps model risk bands to review queue, estimated daily volume, and management action."
    config:
      tags: ["powerbi", "model", "operations", "executive"]
    tests:
      - row_count_equals:
          arguments:
            expected_count: 4
    columns:
      - name: risk_band
        tests:
          - not_null
          - unique

  - name: pbi_threshold_simulation
    description: "Threshold simulation for review workload, fraud capture, and precision trade-off."
    config:
      tags: ["powerbi", "model", "threshold", "operations"]
    tests:
      - row_count_between:
          arguments:
            min_count: 10
            max_count: 20
    columns:
      - name: score_threshold
        tests:
          - not_null
          - unique
      - name: fraud_capture_rate
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: workload_share
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: pbi_report_readiness
    description: "Acceptance checklist table summarizing data, narrative, risk analytics, and model operations readiness."
    config:
      tags: ["powerbi", "qa", "executive"]
    columns:
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ["PASS"]

exposures:
  - name: fraud_project_v2
    label: "fraud_project_v2"
    type: dashboard
    maturity: high
    url: "powerbi/fraud_project_v2.pbix"
    description: "Executive fraud analytics report connected to the BigQuery reporting layer."
    depends_on:
      - ref('fact_train_transactions')
      - ref('pbi_executive_kpis')
      - ref('pbi_product_risk')
      - ref('pbi_identity_risk')
      - ref('pbi_identity_product_coverage')
      - ref('pbi_amount_bands')
      - ref('pbi_daily_drift')
      - ref('pbi_time_amount_signals')
      - ref('pbi_payment_heatmap')
      - ref('pbi_email_domain_risk')
      - ref('pbi_model_risk_bands')
      - ref('pbi_feature_importance')
      - ref('pbi_data_quality_scorecard')
      - ref('pbi_report_narrative')
      - ref('pbi_quality_contract')
      - ref('pbi_segment_watchlist')
      - ref('pbi_review_strategy')
      - ref('pbi_threshold_simulation')
      - ref('pbi_report_readiness')
    owner:
      name: "Fraud Analytics Team"
      email: "fraud.analytics@company.com"
