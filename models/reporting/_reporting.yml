version: 2

models:
  - name: fact_train_transactions
    description: "Reporting fact table for train transactions with fraud label, segments, engineered fields, and model score."
    config:
      tags: ["reporting", "fraud"]
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: is_fraud
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: transaction_hour
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 23
      - name: has_address_proxy
        description: "Flag showing whether at least one masked address proxy field is present."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: has_distance_proxy
        description: "Flag showing whether at least one masked distance proxy field is present."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: address_proxy_status
        description: "Address proxy availability bucket; this is not a geographic location."
        tests:
          - accepted_values:
              arguments:
                values: ["Address missing", "Address partial", "Address both present"]
      - name: distance_proxy_band
        description: "Masked distance proxy bucket; this is not a physical distance interpretation."
        tests:
          - accepted_values:
              arguments:
                values: ["Distance missing", "Distance low", "Distance medium", "Distance high"]

  - name: rpt_executive_kpis
    description: "Single-row KPI table for executive summary reporting."
    config:
      tags: ["reporting", "executive"]
    tests:
      - row_count_equals:
          arguments:
            expected_count: 1

  - name: rpt_product_risk
    description: "Fraud rate, lift, and risk contribution by product."
    config:
      tags: ["reporting", "executive", "segment"]

  - name: rpt_identity_risk
    description: "Fraud risk by identity record availability."
    config:
      tags: ["reporting", "executive", "identity"]

  - name: rpt_identity_product_coverage
    description: "Product-level identity coverage and fraud-rate evidence for executive risk segmentation."
    config:
      tags: ["reporting", "identity", "product", "executive"]
    columns:
      - name: product_cd
        tests:
          - not_null
          - unique
      - name: identity_coverage_rate
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: rpt_amount_bands
    description: "Pre-aggregated amount-band table for the web dashboard reporting layer."
    config:
      tags: ["reporting", "amount"]

  - name: rpt_daily_drift
    description: "Relative-day fraud drift and volume trend."
    config:
      tags: ["reporting", "time"]
    columns:
      - name: drift_flag
        tests:
          - accepted_values:
              arguments:
                values: ["High risk drift", "Low risk drift", "Normal band"]

  - name: rpt_time_amount_signals
    description: "Relative hour and amount-decimal risk signals used for behavioral pattern and dynamic threshold discussion."
    config:
      tags: ["reporting", "time", "amount", "behavior"]
    tests:
      - row_count_between:
          arguments:
            min_count: 24
            max_count: 48

  - name: rpt_payment_heatmap
    description: "Card network and card type risk matrix."
    config:
      tags: ["reporting", "payment"]

  - name: rpt_email_domain_risk
    description: "Fraud risk by purchaser email domain group."
    config:
      tags: ["reporting", "email"]

  - name: rpt_model_risk_bands
    description: "Model risk bands and threshold-policy prioritization metrics."
    config:
      tags: ["reporting", "model", "executive"]
    columns:
      - name: review_priority
        tests:
          - accepted_values:
              arguments:
                values: ["Critical threshold focus", "High-priority analytical band", "Sample-based control check", "Baseline monitoring"]

  - name: rpt_feature_importance
    description: "Model feature importance ranking."
    config:
      tags: ["reporting", "model"]

  - name: rpt_data_quality_scorecard
    description: "Feature-family missingness scorecard for data quality reporting."
    config:
      tags: ["reporting", "data_quality"]

  - name: rpt_proxy_signal_risk
    description: "Address and distance proxy risk summary using masked fields without claiming real geography."
    config:
      tags: ["reporting", "proxy", "data_quality", "segment"]
    tests:
      - row_count_between:
          arguments:
            min_count: 3
            max_count: 8
    columns:
      - name: proxy_family
        tests:
          - accepted_values:
              arguments:
                values: ["Address proxy", "Distance proxy"]
      - name: proxy_segment
        tests:
          - not_null
      - name: fraud_rate
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: transaction_share
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: fraud_share
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: rpt_report_narrative
    description: "Executive message, analytical focus, and recommended action text for report pages."
    config:
      tags: ["reporting", "executive", "storytelling"]

  - name: rpt_quality_contract
    description: "Row-count and quality contract table suitable for reporting."
    config:
      tags: ["reporting", "data_quality", "qa"]
    columns:
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ["PASS"]

  - name: rpt_segment_watchlist
    description: "Unified operational watchlist across product, identity, amount, payment, and email segments."
    config:
      tags: ["reporting", "executive", "segment", "watchlist"]
    tests:
      - row_count_between:
          arguments:
            min_count: 10
            max_count: 20
    columns:
      - name: watchlist_rank
        tests:
          - not_null
          - unique
      - name: risk_priority
        tests:
          - accepted_values:
              arguments:
                values: ["Critical", "High", "Monitor", "Normal"]

  - name: rpt_review_strategy
    description: "Maps model risk bands to threshold policy bands, estimated daily volume, and management action."
    config:
      tags: ["reporting", "model", "threshold", "executive"]
    tests:
      - row_count_equals:
          arguments:
            expected_count: 4
    columns:
      - name: risk_band
        tests:
          - not_null
          - unique
      - name: queue_policy
        tests:
          - accepted_values:
              arguments:
                values:
                  - "Critical score monitoring"
                  - "High-priority threshold review"
                  - "Sample-based control check"
                  - "Baseline monitoring"

  - name: rpt_threshold_simulation
    description: "Threshold simulation for flagged workload, fraud capture, and precision trade-off."
    config:
      tags: ["reporting", "model", "threshold", "validation"]
    tests:
      - row_count_between:
          arguments:
            min_count: 10
            max_count: 20
    columns:
      - name: score_threshold
        tests:
          - not_null
          - unique
      - name: fraud_capture_rate
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: workload_share
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: operating_mode
        tests:
          - accepted_values:
              arguments:
                values:
                  - "Broad monitoring"
                  - "Balanced threshold policy"
                  - "Focused risk policy"
                  - "Narrow critical policy"

  - name: rpt_validation_threshold_simulation
    description: "Holdout validation threshold evidence separated from reporting/train score simulation."
    config:
      tags: ["reporting", "model", "threshold", "validation"]
    tests:
      - row_count_between:
          arguments:
            min_count: 10
            max_count: 20
    columns:
      - name: score_threshold
        tests:
          - not_null
          - unique
      - name: evidence_scope
        tests:
          - accepted_values:
              arguments:
                values: ["validation_holdout"]
      - name: fraud_capture_rate
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: precision_rate
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: workload_share
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: rpt_segment_model_performance
    description: "Holdout validation model performance by business segment family at the selected threshold."
    config:
      tags: ["reporting", "model", "validation", "segment"]
    tests:
      - row_count_between:
          arguments:
            min_count: 10
            max_count: 50
    columns:
      - name: segment_family
        tests:
          - accepted_values:
              arguments:
                values: ["Product", "Amount band", "Identity", "Email domain", "Payment"]
      - name: precision_rate
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: recall_rate
        tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: rpt_report_readiness
    description: "Acceptance checklist table summarizing data, narrative, risk analytics, and model evidence readiness."
    config:
      tags: ["reporting", "qa", "executive"]
    columns:
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ["PASS"]
      - name: readiness_result
        tests:
          - accepted_values:
              arguments:
                values: ["Ready for presentation", "Action required"]

exposures:
  - name: fraud_project_web_dashboard
    label: "Fraud Project Web Dashboard"
    type: dashboard
    maturity: high
    url: "https://fraud-project-web.vercel.app"
    description: "Executive fraud analytics web dashboard connected to the BigQuery reporting layer."
    depends_on:
      - ref('fact_train_transactions')
      - ref('rpt_executive_kpis')
      - ref('rpt_product_risk')
      - ref('rpt_identity_risk')
      - ref('rpt_identity_product_coverage')
      - ref('rpt_amount_bands')
      - ref('rpt_daily_drift')
      - ref('rpt_time_amount_signals')
      - ref('rpt_payment_heatmap')
      - ref('rpt_email_domain_risk')
      - ref('rpt_model_risk_bands')
      - ref('rpt_feature_importance')
      - ref('rpt_data_quality_scorecard')
      - ref('rpt_proxy_signal_risk')
      - ref('rpt_report_narrative')
      - ref('rpt_quality_contract')
      - ref('rpt_segment_watchlist')
      - ref('rpt_review_strategy')
      - ref('rpt_threshold_simulation')
      - ref('rpt_validation_threshold_simulation')
      - ref('rpt_segment_model_performance')
      - ref('rpt_report_readiness')
    owner:
      name: "Fraud Analytics Team"
      email: "fraud.analytics@company.com"
