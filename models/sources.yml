version: 2

sources:
  - name: raw
    description: "Raw Kaggle IEEE-CIS Fraud Detection data layer and model support outputs."
    schema: "{{ 'fraud_project_raw' if target.type == 'bigquery' else 'raw' }}"
    tables:
      - name: train_transaction
        description: "Training transaction table with fraud labels and transaction features."
        tests:
          - row_count_equals:
              arguments:
                expected_count: 590540
      - name: train_identity
        description: "Training identity table with device and identity signals."
        tests:
          - row_count_equals:
              arguments:
                expected_count: 144233
      - name: test_transaction
        description: "Kaggle test transaction table."
        tests:
          - row_count_equals:
              arguments:
                expected_count: 506691
      - name: test_identity
        description: "Kaggle test identity table."
        tests:
          - row_count_equals:
              arguments:
                expected_count: 141907
      - name: sample_submission
        description: "Kaggle sample submission table."
        tests:
          - row_count_equals:
              arguments:
                expected_count: 506691
      - name: ml_predictions
        description: "Fraud probabilities and risk bands produced by the LightGBM model for train and test transactions."
        tests:
          - row_count_equals:
              arguments:
                expected_count: 1097231
      - name: feature_missingness
        description: "Missingness profile table for raw columns."
      - name: feature_importance
        description: "LightGBM feature importance output."
