[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "dbt_packages",
    "target",
    "logs",
    "data",
    "outputs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
addopts = "-q"
