[project]
name = "fraud-project"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.3",
    "google-cloud-bigquery==3.41.0",
    "python-dotenv==1.2.2",
]

[tool.vercel]
entrypoint = "webapp.main:app"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "dbt_packages",
    "target",
    "logs",
    "data",
    "outputs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
addopts = "-q"
