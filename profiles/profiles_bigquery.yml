ieee_fraud_detection:
  target: prod
  outputs:
    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', 'workintech-working') }}"
      dataset: fraud_project_staging
      threads: 4
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      location: "{{ env_var('BIGQUERY_LOCATION', 'US') }}"
      priority: interactive
      maximum_bytes_billed: 10000000000
