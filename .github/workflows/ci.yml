name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  python-quality:
    name: Python quality and web validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        run: pytest

      - name: Compile web dashboard package
        run: python -m compileall webapp

      - name: Dependency audit (runtime and development)
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt

  dbt-duckdb:
    name: dbt build and test
    runs-on: ubuntu-latest

    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      FRAUD_PROJECT_DUCKDB_PATH: data/processed/ieee_fraud.duckdb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install kaggle

      - name: Determine data-validation mode (never print credentials)
        id: kaggle
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Full IEEE-CIS data build: NOT RUN (pull request/push CI is metadata-only)." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$KAGGLE_API_TOKEN" ] || { [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Full IEEE-CIS data build: REQUESTED; Kaggle access will be verified by the download step." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Full IEEE-CIS data build: NOT RUN (no configured repository secret)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download Kaggle data
        if: steps.kaggle.outputs.enabled == 'true'
        run: |
          mkdir -p data/raw/kaggle_ieee_fraud
          kaggle competitions download -c ieee-fraud-detection -p data/raw/kaggle_ieee_fraud
          unzip -o data/raw/kaggle_ieee_fraud/ieee-fraud-detection.zip -d data/raw/kaggle_ieee_fraud

      - name: Prepare local data and ML outputs
        if: steps.kaggle.outputs.enabled == 'true'
        run: python src/prepare_raw_and_ml.py

      - name: dbt deps
        run: dbt deps --project-dir .

      - name: dbt parse
        if: steps.kaggle.outputs.enabled != 'true'
        run: dbt parse --project-dir . --profiles-dir config/dbt --profile ieee_fraud_detection --target dev

      - name: dbt run
        if: steps.kaggle.outputs.enabled == 'true'
        run: dbt run --project-dir . --profiles-dir config/dbt --profile ieee_fraud_detection --target dev

      - name: dbt test
        if: steps.kaggle.outputs.enabled == 'true'
        run: dbt test --project-dir . --profiles-dir config/dbt --profile ieee_fraud_detection --target dev
