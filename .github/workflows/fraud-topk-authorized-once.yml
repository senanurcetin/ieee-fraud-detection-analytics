name: Authorized Fraud Calibration Top-K — Single Run

on:
  push:
    branches: [research/authorized-topk-20261017]
    paths: [.github/workflows/fraud-topk-authorized-once.yml]

permissions:
  contents: read

concurrency:
  group: fraud-authorized-calibration-topk-20261017
  cancel-in-progress: false

jobs:
  calibrated-review-queue:
    if: github.repository == 'senanurcetin/ieee-fraud-detection-analytics' && github.event.head_commit.message == 'RUN_AUTHORIZED_FRAUD_TOPK_20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONUNBUFFERED: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Checkout exact full-data research revision
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify encrypted Kaggle token availability
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo "BLOCKED: Kaggle repo secret missing." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Install pinned research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install kaggle
      - name: Fetch authorized IEEE-CIS original train files privately
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p data/raw/kaggle_ieee_fraud
          kaggle competitions download -c ieee-fraud-detection -p data/raw/kaggle_ieee_fraud
          unzip -oq data/raw/kaggle_ieee_fraud/ieee-fraud-detection.zip train_transaction.csv train_identity.csv -d data/raw/kaggle_ieee_fraud
          test -s data/raw/kaggle_ieee_fraud/train_transaction.csv
          test -s data/raw/kaggle_ieee_fraud/train_identity.csv
      - name: Save checksums, source/commit evidence only
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          d=Path("data/raw/kaggle_ieee_fraud")
          def sha(p):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for c in iter(lambda:f.read(1024*1024),b""): h.update(c)
              return h.hexdigest()
          output=Path("outputs/research")
          output.mkdir(parents=True,exist_ok=True)
          manifest={"source":"kaggle/competitions/ieee-fraud-detection",
                    "study":"calibration_with_top_k_review_queue",
                    "train_transaction_sha256":sha(d/"train_transaction.csv"),
                    "train_identity_sha256":sha(d/"train_identity.csv"),
                    "commit":os.environ["GITHUB_SHA"],"run":os.environ["GITHUB_RUN_ID"],
                    "subset_mode":False,"model_promotion":False,
                    "bigquery_sql_jobs":0,"snapshot_rewritten":False}
          (output/"source_manifest.json").write_text(json.dumps(manifest,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Import original full train dataset locally
        run: |
          python -m scripts.prepare_research_duckdb \
            --source data/raw/kaggle_ieee_fraud \
            --duckdb data/processed/ieee_fraud.duckdb
      - name: Compute independent 60-20-20 temporal calibration and top-k metrics
        run: |
          python -m scripts.benchmark_temporal_calibration \
            --duckdb data/processed/ieee_fraud.duckdb \
            --n-estimators 150 \
            --output outputs/research/research_report.json
      - name: Confirm expected review queues and numerical evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("outputs/research/research_report.json")
          report=json.loads(p.read_text(encoding="utf-8"))
          assert report["input_rows"]==590540
          assert not report["subset_mode"] and report["changes_published_model"] is False
          metrics=report["final_holdout_metrics"]
          assert set(metrics)=={"raw_ranker","platt_logistic","isotonic","constant_core_prior"}
          for name,value in metrics.items():
              q=value["top_k_review_queue"]
              assert set(q)=={"top_1pct","top_5pct","top_10pct"}
              for label,group in q.items():
                  assert group["review_rows"]>0
                  assert 0<=group["precision"]<=1
                  assert 0<=group["recall"]<=1
                  assert 0<=group["fraud_cases_captured"]<=report["split_rows"]["untouched_final_holdout"]
          print("PASS: full-source, four model methods, and 12 top-k queue records verified.")
          PY
      - name: Preserve only aggregate metrics and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fraud-calibration-topk-${{ github.run_id }}
          path: |
            outputs/research/research_report.json
            outputs/research/source_manifest.json
          if-no-files-found: warn
          retention-days: 7
      - name: Erase runner raw Kaggle CSV and temporary DuckDB files
        if: always()
        run: |
          rm -rf data/raw/kaggle_ieee_fraud data/processed/ieee_fraud.duckdb data/processed/ieee_fraud.duckdb.wal
